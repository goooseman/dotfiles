- name: Get current git email
  community.general.git_config_info:
    name: user.email
    scope: global
  register: current_git_email

- name: Ask user for his email to set up git
  pause:
    prompt: "What is your git full email (ex. goooseman@me.com)?"
  register: git_email
  when: current_git_email.config_value is not defined or current_git_email.config_value | length == 0

- name: Set git email
  community.general.git_config:
    name: user.email
    scope: global
    state: present
    value: "{{ git_email.user_input }}"
  when: current_git_email.config_value is not defined or current_git_email.config_value | length == 0